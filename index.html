<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>스마트 스위치 탐색기</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#17324d;background:#eef5fb}*{box-sizing:border-box}body{margin:0;padding:24px}.wrap{max-width:760px;margin:auto}.card{background:#fff;border-radius:20px;padding:24px;margin:16px 0;box-shadow:0 10px 30px #17324d18}h1{margin:0 0 8px;font-size:29px}h2{margin:0 0 12px;font-size:20px}.muted{color:#61778c}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,select{border:0;border-radius:11px;padding:12px 16px;font-size:15px}button{color:#fff;background:#1b5d8f;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:wait}select{background:#e8f0f7;color:#17324d;min-width:180px}.scan{border:2px dashed #9eb8ce;border-radius:16px;padding:22px;text-align:center}.room{border:1px solid #d3e0eb;border-radius:14px;padding:15px;margin-top:12px}.switch{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #edf2f6}.switch:first-of-type{border-top:0}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#32a852;margin-right:7px}.off .dot{background:#9aa9b5}.status{margin-top:14px;padding:12px;border-radius:10px;background:#f0f6fa}
</style></head><body><main class="wrap">
<section class="card"><h1>스마트 스위치 탐색기</h1><p class="muted">방을 탐색하고, 원하는 스위치를 가상 제어 기계에 보내는 연결형 시제품</p></section>
<section class="card"><h2>1. 방 탐색</h2><div class="scan"><p id="scanText">아직 탐색하지 않았어요.</p><button id="scanBtn">방 탐색 시작</button></div><div id="rooms"></div></section>
<section class="card"><h2>2. 제어할 스위치 선택</h2><div class="row"><select id="roomSelect" disabled><option>먼저 방을 탐색하세요</option></select><select id="switchSelect" disabled><option>스위치를 선택하세요</option></select><button id="sendBtn" disabled>기계에 끄기 명령 보내기</button></div><div class="status" id="status">대기 중</div></section>
<section class="card"><h2>3. 기계 통신 상태</h2><p class="muted">현재는 하드웨어가 없어 가상 기계가 명령을 대신 실행합니다.</p><p><span class="dot"></span>가상 제어 기계 연결됨</p><p class="muted">나중에는 이 부분을 ESP32·서보모터·카메라 통신으로 교체할 수 있어요.</p></section>
<script>
const discovered=[{room:'침실',switches:['침실 천장등','침대 옆 스탠드']},{room:'거실',switches:['거실 천장등','소파 옆 조명']},{room:'주방',switches:['주방 조명']}];const $=s=>document.querySelector(s);
function renderRooms(){$('#rooms').innerHTML=discovered.map(r=>`<div class="room"><b>${r.room}</b>${r.switches.map((s,i)=>`<div class="switch" id="row-${r.room}-${i}"><span><span class="dot"></span>${s}</span><span class="muted">켜짐</span></div>`).join('')}</div>`).join('')}
function loadSwitches(){const r=discovered.find(x=>x.room===$('#roomSelect').value);$('#switchSelect').innerHTML=r.switches.map((s,i)=>`<option value="${i}">${s}</option>`).join('');$('#switchSelect').disabled=false;$('#sendBtn').disabled=false}
$('#scanBtn').onclick=()=>{$('#scanBtn').disabled=true;$('#scanText').textContent='카메라로 방과 스위치 위치를 분석하는 중...';setTimeout(()=>{renderRooms();$('#scanText').textContent='탐색 완료: 3개 방, 5개 스위치를 찾았어요.';$('#roomSelect').innerHTML=discovered.map(r=>`<option>${r.room}</option>`).join('');$('#roomSelect').disabled=false;loadSwitches();$('#scanBtn').disabled=false},900)};$('#roomSelect').onchange=loadSwitches;
$('#sendBtn').onclick=()=>{const room=$('#roomSelect').value,idx=Number($('#switchSelect').value),name=$('#switchSelect').selectedOptions[0].textContent;$('#sendBtn').disabled=true;$('#status').textContent=`${room}의 ${name}을(를) 제어 기계로 보내는 중...`;setTimeout(()=>{const row=$(`#row-${room}-${idx}`);row.classList.add('off');row.querySelector('.dot').style.background='#9aa9b5';row.querySelector('.muted').textContent='꺼짐';$('#status').textContent=`실행 완료: ${room} · ${name} 스위치를 껐어요.`;$('#sendBtn').disabled=false},700)};
</script></main></body></html>
