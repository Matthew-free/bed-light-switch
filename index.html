<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>침대에서 편하게 불 끄기</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eef5fb; color: #17324d; }
    .card { width: min(92vw, 520px); padding: 32px; border-radius: 24px; background: white; box-shadow: 0 14px 40px #17324d22; text-align: center; }
    h1 { margin: 0 0 10px; font-size: 28px; }
    p { color: #5e7388; }
    .lamp { width: 150px; height: 150px; margin: 28px auto; border-radius: 50%; background: #d8e3ed; transition: .25s; box-shadow: inset 0 0 0 8px #c5d4e1; }
    .lamp.on { background: #ffe58a; box-shadow: 0 0 45px #ffd34d, inset 0 0 0 8px #f6c94c; }
    button { border: 0; border-radius: 14px; padding: 14px 26px; font-size: 17px; font-weight: 700; color: white; background: #1b5d8f; cursor: pointer; }
    button:hover { background: #12466d; }
    #status { margin-top: 16px; font-weight: 700; }
  </style>
</head>
<body>
  <main class="card">
    <h1>침대에서 편하게 불 끄기</h1>
    <p>리모컨 버튼을 눌러 불을 켜고 꺼 보세요.</p>
    <div id="lamp" class="lamp on" aria-label="전등"></div>
    <button id="remote" type="button">리모컨 버튼 누르기</button>
    <div id="status">현재 상태: 켜짐</div>
  </main>
  <script>
    const lamp = document.querySelector('#lamp');
    const status = document.querySelector('#status');
    document.querySelector('#remote').addEventListener('click', () => {
      const on = lamp.classList.toggle('on');
      status.textContent = `현재 상태: ${on ? '켜짐' : '꺼짐'}`;
    });
  </script>
</body>
</html>
